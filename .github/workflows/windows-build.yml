name: Сборка приложения для Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Включение поддержки Windows
        run: flutter create --platforms=windows .

      - name: Загрузка зависимостей
        run: flutter pub get

      - name: Статический анализ кода
        run: flutter analyze

      - name: Сборка приложения для Windows
        run: flutter build windows --release
